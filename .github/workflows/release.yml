name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (e.g. 0.1.0)'
        required: true

permissions:
  contents: write
  # Lets the job ask GitHub for the short lived token NuGet exchanges for a publishing key.
  # Without it there is no long lived secret to leak, and also no way to publish.
  id-token: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          $v = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ inputs.version }}'
          } else {
            '${{ github.ref_name }}' -replace '^v', ''
          }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Version '$v' is not major.minor.patch" }
          "value=$v" >> $env:GITHUB_OUTPUT
          "Building $v"

      - name: Test before shipping anything
        run: dotnet test --configuration Release

      - name: Publish the shell
        run: >
          dotnet publish Meows/Meows.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:Version=${{ steps.version.outputs.value }}
          --output artifacts/Meows-win-x64

      # The shell does not reference plugin projects, which is what keeps them drop-in, so
      # publishing alone produces an app with no plugins. Each one has to be staged.
      - name: Build the plugins
        shell: pwsh
        run: |
          # Found on disk rather than listed here. A list has to be edited for every new plugin,
          # and forgetting to is not caught by anything until the package ships without it.
          $projects = Get-ChildItem Meows.Plugins.* -Directory |
            Where-Object { $_.Name -ne 'Meows.Plugins.Abstractions' } |
            ForEach-Object { Join-Path $_.FullName "$($_.Name).csproj" } |
            Where-Object { Test-Path $_ }

          if ($projects.Count -eq 0) { throw "No plugin projects found" }

          foreach ($project in $projects) {
            dotnet build $project --configuration Release
            if ($LASTEXITCODE -ne 0) { throw "Failed to build $project" }
          }
          "built $($projects.Count) plugin(s)"

      - name: Stage the plugins into the package
        shell: pwsh
        run: |
          # Copy the whole build output rather than just the plugin dll. A plugin may bring
          # libraries of its own: Telegram Poster and Kibble need Meows.Bot.Core.dll, and
          # Purrge and Chonk need Meows.Disk.dll,
          # which is loaded from the plugin's own folder. Avalonia and the contract are not
          # here to be copied: the csproj files keep them out so the shell stays the one
          # source of both.
          $plugins = Get-ChildItem Meows.Plugins.* -Directory |
            Where-Object { $_.Name -ne 'Meows.Plugins.Abstractions' } |
            ForEach-Object { $_.Name }

          foreach ($p in $plugins) {
            $dest = "artifacts/Meows-win-x64/plugins/$p"
            New-Item -ItemType Directory -Force $dest | Out-Null
            Copy-Item "$p/bin/Release/*.dll" $dest
            Copy-Item "$p/bin/Release/*.deps.json" $dest -ErrorAction SilentlyContinue
          }
          Get-ChildItem artifacts/Meows-win-x64/plugins -Directory | ForEach-Object {
            $files = (Get-ChildItem $_.FullName -File | ForEach-Object Name) -join ', '
            "staged $($_.Name): $files"
          }

      - name: Drop third-party native symbols
        shell: pwsh
        run: |
          # libSkiaSharp.pdb and libHarfBuzzSharp.pdb are about half the output and are no use
          # here. Meows' own pdbs stay, so stack traces remain readable.
          Get-ChildItem artifacts/Meows-win-x64 -Filter *.pdb |
            Where-Object { $_.Name -notlike 'Meows*' } |
            Remove-Item -Force
          "{0:N0} MB" -f ((Get-ChildItem artifacts/Meows-win-x64 -Recurse -File |
            Measure-Object Length -Sum).Sum / 1MB)

      - name: Check the package can actually load what is in it
        shell: pwsh
        run: |
          # The old version of this step was a list of expected file paths, typed by hand and
          # edited for every new plugin. It could only ever check what somebody remembered to
          # add, which is the same weakness as the problem it existed to catch.
          #
          # This asks the packaged app instead. --list-plugins runs discovery and the dependency
          # check without opening a window, and returns non zero if anything was refused or is
          # missing a private library. A plugin whose shared library did not get staged loads
          # perfectly and then fails the moment it is switched on, so being present is not the
          # same as being usable, and only one of those can be checked by looking at file names.
          $exe = 'artifacts/Meows-win-x64/Meows.exe'
          if (-not (Test-Path $exe)) { throw "No Meows.exe in the package" }

          # Started rather than called. Meows is a WinExe, and PowerShell does not wait for a
          # windowed process: the call operator returns immediately and never sets an exit code,
          # so a check written the obvious way would pass no matter what the package contained.
          $log = Join-Path ([System.IO.Path]::GetTempPath()) 'meows-plugins.txt'
          $run = Start-Process -FilePath (Resolve-Path $exe) -ArgumentList '--list-plugins' `
            -Wait -PassThru -NoNewWindow -RedirectStandardOutput $log

          $output = Get-Content $log
          $output | ForEach-Object { "  $_" }
          if ($run.ExitCode -ne 0) { throw "The packaged app could not load its own plugins" }

          # And it has to find every plugin in the repository, not merely load the ones it found.
          $expected = (Get-ChildItem Meows.Plugins.* -Directory |
            Where-Object { $_.Name -ne 'Meows.Plugins.Abstractions' }).Count
          $loaded = ([regex]::Matches(($output -join "`n"), '(?m)^ok\s')).Count

          if ($loaded -ne $expected) {
            # Says what it read, so a failure here explains itself rather than needing a rerun
            # with more printing. Nothing read at all usually means the output went somewhere
            # else rather than that the package is empty.
            throw "Packaged $loaded plugin(s), but the repository has $expected. " +
                  "The listing was $($output.Count) line(s) long."
          }
          "all $expected plugin(s) present and loadable"

      - name: Zip it
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/Meows-win-x64/* `
            -DestinationPath "artifacts/Meows-${{ steps.version.outputs.value }}-win-x64.zip" `
            -CompressionLevel Optimal

      - name: Pack the plugin contract and the template
        run: |
          dotnet pack Meows.Plugins.Abstractions/Meows.Plugins.Abstractions.csproj --configuration Release --output artifacts/nuget
          dotnet pack template/Meows.Plugins.Template.csproj --configuration Release --output artifacts/nuget

      # Is there anything to publish with? Asked separately so the two steps below can be
      # skipped cleanly: a fork with no nuget.org account should still get a working release,
      # and a step that is skipped says so far more plainly than one that exits early.
      - name: Can we publish to NuGet
        id: nuget
        shell: pwsh
        env:
          # Through the environment rather than pasted into the script text, so a value with a
          # quote in it cannot end up being read as part of the script.
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          $can = -not [string]::IsNullOrWhiteSpace($env:NUGET_USER)
          "publish=$($can.ToString().ToLower())" | Out-File $env:GITHUB_OUTPUT -Append
          if (-not $can) {
            "No NUGET_USER secret, so nothing will be pushed to NuGet. The packages are still attached to the release."
          }

      # Trusted Publishing rather than a stored key: the job proves who it is with a token
      # GitHub signs, and nuget.org hands back an API key good for one hour. Nothing long lived
      # exists to be leaked. The policy on nuget.org names this repository and this file, so
      # renaming this workflow breaks publishing until the policy is updated to match.
      #
      # Requested here rather than earlier because the key expires in an hour, and everything
      # slow, the tests and the publish, has already happened by this point.
      - name: Get a short lived NuGet key
        id: login
        if: steps.nuget.outputs.publish == 'true'
        uses: NuGet/login@v1
        with:
          # The nuget.org profile name, not an email address.
          user: ${{ secrets.NUGET_USER }}

      - name: Publish the contract and template to NuGet
        if: steps.nuget.outputs.publish == 'true'
        shell: pwsh
        run: |
          # Listed here rather than handed to dotnet as a wildcard. PowerShell passes
          # artifacts/nuget/*.nupkg through untouched, and whether dotnet expands it varies, so
          # a wildcard either pushes nothing or quietly pushes the .snupkg too.
          #
          # Only .nupkg: the matching .snupkg goes up with its package automatically, and
          # pushing one on its own is an error.
          $packages = Get-ChildItem artifacts/nuget -File |
            Where-Object { $_.Extension -eq '.nupkg' }

          if ($packages.Count -eq 0) { throw "Nothing to push: artifacts/nuget has no .nupkg" }

          foreach ($package in $packages) {
            # The id and version out of the file name. Ours have no digit-only segment in the
            # id, so the first thing that looks like a version starts the version.
            if ($package.Name -notmatch '^(?<id>.+?)\.(?<version>\d+\.\d+\.\d+.*)\.nupkg$') {
              throw "Cannot read an id and version from $($package.Name)"
            }
            $id = $Matches.id
            $version = $Matches.version

            # Asked before pushing rather than inferred from the result afterwards. A version
            # already on NuGet is normal and expected: the contract only moves when the contract
            # changes, so most releases re-pack a version that is already published.
            $already = $false
            try {
              $index = Invoke-RestMethod -UseBasicParsing `
                -Uri "https://api.nuget.org/v3-flatcontainer/$($id.ToLower())/index.json"
              $already = $index.versions -contains $version
            } catch {
              $already = $false
            }

            if ($already) {
              "$id $version is already on NuGet, leaving it alone"
              continue
            }

            # No --skip-duplicate. It was here so a repeated release would not fail, and it did
            # something far worse: NuGet answered 409 Conflict for a version that does not exist
            # publicly, --skip-duplicate called that success, and the build went green having
            # published nothing at all. A version we have just established is not published must
            # either go up or fail loudly.
            "pushing $id $version"
            dotnet nuget push $package.FullName `
              --source https://api.nuget.org/v3/index.json `
              --api-key ${{ steps.login.outputs.NUGET_API_KEY }}

            if ($LASTEXITCODE -ne 0) { throw "Pushing $id $version to NuGet failed" }
          }

          "done"

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.version.outputs.value }}'
          $notes = @"
          Self-contained Windows x64 build. No .NET runtime needed.

          Download ``Meows-$v-win-x64.zip``, unzip it anywhere, and run ``Meows.exe``. Extract the
          zip before running it: launching straight out of the archive leaves some plugins
          without files they need.

          Every plugin starts switched off. Turn on the ones you want on the Plugins tab.

          Writing your own: ``dotnet new install Meows.Plugins.Template`` then
          ``dotnet new meows-plugin -n YourPlugin``. Both packages are on NuGet and attached here.
          See PLUGIN-GUIDE.md.
          "@
          $assets = @("artifacts/Meows-$v-win-x64.zip") +
                    (Get-ChildItem artifacts/nuget/*.nupkg | ForEach-Object { $_.FullName })

          # Re-pushing a tag is normal, whether from a history rewrite or a rebuilt asset, so
          # update an existing release rather than failing on it. The try/catch is because a
          # missing release makes gh exit non-zero, and depending on the PowerShell version
          # that either sets $LASTEXITCODE or throws outright.
          $exists = $false
          try {
            gh release view "v$v" *> $null
            $exists = ($LASTEXITCODE -eq 0)
          } catch {
            $exists = $false
          }

          if ($exists) {
            Write-Host "Release v$v already exists, updating it."
            # --draft=false matters: deleting a tag demotes its release to a draft, and
            # editing one does not publish it again on its own.
            gh release edit "v$v" --title "Meows $v" --notes $notes --draft=false
            gh release upload "v$v" @assets --clobber
          } else {
            Write-Host "Creating release v$v."
            gh release create "v$v" @assets --title "Meows $v" --notes $notes
          }
