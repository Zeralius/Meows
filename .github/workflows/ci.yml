name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    # Windows is required, not a preference: the app is a WinExe and Purrge deletes through
    # the Windows shell.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Check the plugin contract still packs
        run: dotnet pack Mews.Plugins.Abstractions/Mews.Plugins.Abstractions.csproj --no-build --configuration Release --output artifacts/nuget
