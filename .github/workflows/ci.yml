name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    # Windows is required, not a preference: the app is a WinExe and Purrge deletes through
    # the Windows shell.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Check the plugin contract still packs
        run: dotnet pack Meows.Plugins.Abstractions/Meows.Plugins.Abstractions.csproj --no-build --configuration Release --output artifacts/nuget

      - name: Check the plugin template still produces something that builds
        shell: pwsh
        run: |
          # Generated and built for real, against the contract packed a moment ago. A template is
          # not compiled by anything, so nothing else here would notice it breaking: the first
          # version of this one renamed IMeowsPlugin to IWeatherWatch, because the token it
          # substitutes was a substring of the interface name. That built fine as a template and
          # produced a project that could not compile.
          $ErrorActionPreference = 'Continue'

          $template = Join-Path $env:GITHUB_WORKSPACE 'template'
          $work = Join-Path $env:RUNNER_TEMP 'template-check'
          Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $work | Out-Null

          "sdk $(dotnet --version), template at $template"

          # Absolute paths throughout. dotnet new records what it installed by full path, so a
          # relative one is not reliably the same handle when uninstalling later.
          dotnet new install $template
          if ($LASTEXITCODE -ne 0) { throw "The template would not install" }

          Push-Location $work
          # No --Category: it has a default, and passing a symbol by name is the sort of thing
          # that varies between SDK versions. What matters here is that the output compiles.
          dotnet new meows-plugin -n WeatherWatch
          if ($LASTEXITCODE -ne 0) { throw "The template would not generate" }

          "generated:"
          Get-ChildItem WeatherWatch -Recurse -File | ForEach-Object { "  $($_.FullName.Substring($work.Length))" }

          # A local feed, because the contract version being tested is the one just built rather
          # than whatever is on NuGet.
          $feed = (Resolve-Path (Join-Path $env:GITHUB_WORKSPACE 'artifacts/nuget')).Path
          "feed $feed holds: $((Get-ChildItem $feed | ForEach-Object Name) -join ', ')"

          Push-Location WeatherWatch

          # One string with a placeholder swapped out, rather than pieces joined together.
          # Building this XML by concatenation inside an array literal made PowerShell treat
          # each piece as its own element, so the path was written on a line of its own, XML
          # folded the newline into a space, and NuGet read a path starting with a space as
          # relative. Nothing about the source read wrongly; it was three quoting rules meeting.
          #
          # A config file rather than --source, because --source replaces the configured sources
          # instead of adding to them, and passing nuget.org's URL that way had it normalised
          # into a relative path relative to the project folder. Adding a source in a config
          # leaves the inherited ones alone, which is what is wanted.
          $xml = '<?xml version="1.0" encoding="utf-8"?><configuration><packageSources><add key="meows-local" value="FEED-PATH" /></packageSources></configuration>'
          Set-Content nuget.config -Value $xml.Replace('FEED-PATH', $feed) -Encoding utf8
          "nuget.config written as:"
          Get-Content nuget.config | ForEach-Object { "  $_" }

          dotnet restore
          $restored = $LASTEXITCODE

          $built = 1
          if ($restored -eq 0) {
            dotnet build --no-restore --configuration Release
            $built = $LASTEXITCODE
          }

          Pop-Location
          Pop-Location

          # Cleanup, and never the reason this step fails. GitHub ends a pwsh step with the last
          # exit code it saw, so an uninstall that grumbles would fail a build in which the thing
          # being tested worked perfectly.
          dotnet new uninstall $template | Out-Null

          if ($restored -ne 0) { throw "The generated plugin does not restore" }
          if ($built -ne 0) { throw "The generated plugin does not compile" }
          "the template generates a plugin that builds"
          exit 0
